name: CPU check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: cpu info
        run: |
          echo "nproc: $(nproc)"
          cat /proc/cpuinfo | grep "model name" | head -1
          cat /proc/cpuinfo | grep "^MHz\|cpu MHz" | head -4
          free -h
          echo "--- lscpu ---"
          lscpu
