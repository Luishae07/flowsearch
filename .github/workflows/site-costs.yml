name: Site costs per hour
on:
  workflow_dispatch:
    inputs:
      visits_per_hour:
        description: Assumed visitors per hour
        default: "1000"
      top_sites:
        description: How many of the most popular sites to add (from the Tranco list)
        default: "100"
      egress_per_gb:
        description: Price of one GB sent out (USD)
        default: "0.085"
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: site-costs
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Measure every site
        env:
          VISITS_PER_HOUR: ${{ github.event.inputs.visits_per_hour || '1000' }}
          EGRESS_PER_GB: ${{ github.event.inputs.egress_per_gb || '0.085' }}
          TOP_SITES: ${{ github.event.inputs.top_sites || '100' }}
        run: cd tools/sitecost && go run . -root ../..
      - name: Show the table
        run: cat SITE-COSTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-costs.json SITE-COSTS.md
          git diff --cached --quiet || git commit -m "Site costs per hour"
          git pull --rebase origin main
          git push
