name: flowcrawl

# The Flowsearch crawl in batches of 500 sites. One job = one batch = a slice of crawler/seeds-tranco.txt followed by crawler/seeds-discovered.txt
# (the sites the crawl itself found in links; a bot on the server keeps that file growing).
# Each job reads its 500 sites all at the same time (plain requests, real Firefox for pages that need JavaScript)
# and sends everything it found to the Flowsearch ingest in ONE request. The new site names it saw in links are kept as an artifact.
# Start it by hand (Actions > flowcrawl > Run workflow) or let the box on the server do it (it runs `gh workflow run flowcrawl.yml`).
on:
  workflow_dispatch:
    inputs:
      ingest_url:
        description: "address of the Flowsearch ingest (the cloudflared tunnel to port 8811), without /api/ingest"
        required: true
      first_batch:
        description: "number of the first batch (batch N reads sites N*500 ...)"
        default: "0"
      batches:
        description: "how many batches to run (one job each, up to 20 at the same time)"
        default: "20"
      pages_per_site:
        description: "pages read from each site"
        default: "10"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 -c "import json,sys; a=int(sys.argv[1]); n=int(sys.argv[2]); print('matrix=' + json.dumps(list(range(a, a+n))))" "${{ inputs.first_batch }}" "${{ inputs.batches }}" >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flowcrawl
      - name: build
        run: cargo build --release --manifest-path flowcrawl/Cargo.toml
      - name: crawl batch ${{ matrix.batch }}
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          ulimit -n 65000 || true
          { cat crawler/seeds-tranco.txt; echo; cat crawler/seeds-discovered.txt 2>/dev/null; } > all-seeds.txt
          START=$(( ${{ matrix.batch }} * 500 ))
          ./flowcrawl/target/release/flowcrawl \
            --seeds all-seeds.txt \
            --start "$START" --count 500 \
            --pages "${{ inputs.pages_per_site }}" --conc 500 --render 4 \
            --ingest "${{ inputs.ingest_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovered-${{ matrix.batch }}
          path: discovered.txt
          retention-days: 2
          if-no-files-found: ignore
