[package]
name = "flowcrawl"
version = "0.2.0"
edition = "2021"
description = "Flowsearch crawler: reads a batch of sites in parallel (plain requests, Firefox for JavaScript pages) and sends it to the ingest in one request"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
fantoccini = "0.21"
futures = "0.3"
scraper = "0.20"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texting_robots = "0.2"

# the crawler waits for the network almost all of the time, so a quick build matters more than the last bit of speed
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false
incremental = false
