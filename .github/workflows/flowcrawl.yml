name: flowcrawl

# The Flowsearch crawl: ONE job. It builds the Rust crawler once, then reads batch after batch of 500 sites.
# In a batch all 500 sites are read at the same time (plain requests, real Firefox for pages that need JavaScript),
# and everything found goes to the Flowsearch ingest in ONE request. Sites: crawler/seeds-tranco.txt, then crawler/seeds-discovered.txt
# (the sites the crawl itself found in links; a bot on the server keeps that file growing).
# Start it by hand (Actions > flowcrawl > Run workflow) or let the box on the server do it (it runs `gh workflow run flowcrawl.yml`).
on:
  workflow_dispatch:
    inputs:
      ingest_url:
        description: "address of the Flowsearch ingest (the cloudflared tunnel to port 8811), without /api/ingest"
        required: true
      first_batch:
        description: "number of the first batch (batch N reads sites N*500 ...)"
        default: "0"
      batches:
        description: "how many batches, one after the other"
        default: "20"
      pages_per_site:
        description: "pages read from each site"
        default: "10"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: get the prebuilt crawler (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p flowcrawl/target/release
          gh release download flowcrawl-bin --repo "$GITHUB_REPOSITORY" --pattern flowcrawl --dir flowcrawl/target/release --clobber
          chmod +x flowcrawl/target/release/flowcrawl
      - name: crawl
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          ulimit -n 65000 || true
          { cat crawler/seeds-tranco.txt; echo; cat crawler/seeds-discovered.txt 2>/dev/null || true; } > all-seeds.txt
          # ONE crawler for the whole run: it keeps reading sites, and sends the ingest ONE request every time exactly 500 new pages are ready
          # (batches of pages, nothing on a timer; only the very last request of the run can be smaller)
          ./flowcrawl/target/release/flowcrawl \
            --seeds all-seeds.txt \
            --start $(( ${{ inputs.first_batch }} * 500 )) --count $(( ${{ inputs.batches }} * 500 )) \
            --pages "${{ inputs.pages_per_site }}" --conc 500 --render 4 \
            --ingest "${{ inputs.ingest_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovered-${{ github.run_id }}
          path: discovered.txt
          retention-days: 2
          if-no-files-found: ignore
