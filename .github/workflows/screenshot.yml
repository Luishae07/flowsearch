name: Flowsearch site screenshot (Playwright + Firefox)
on:
  workflow_dispatch:
    inputs:
      site:
        description: "The site to screenshot (hostname, e.g. example.com) - the one the webmaster is currently viewing"
        required: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install playwright npm package
        run: |
          npm init -y >/dev/null
          npm install playwright >/dev/null
      - name: cache playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}
      - name: cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-firefox-deps-${{ runner.os }}
      - name: install firefox browser (only on cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox
      - name: install firefox OS deps (always needed, cache only covers the browser binary)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox
      - name: screenshot
        run: |
          mkdir -p screenshots
          node - <<'EOF'
          const { firefox } = require('playwright');
          (async () => {
            const site = process.env.SITE;
            const browser = await firefox.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            try {
              await page.goto('https://' + site + '/', { waitUntil: 'load', timeout: 20000 });
            } catch (e) {
              console.log('nav error (still screenshotting whatever loaded):', e.message);
            }
            await page.screenshot({ path: 'screenshots/' + site + '.png' });
            await browser.close();
          })();
          EOF
        env:
          SITE: ${{ github.event.inputs.site }}
      - name: upload screenshot to Hugging Face
        run: |
          pip install -q huggingface_hub
          python3 -c "
          from huggingface_hub import HfApi
          import os
          HfApi(token=os.environ['HF_TOKEN']).upload_file(
              path_or_fileobj='screenshots/${{ github.event.inputs.site }}.png',
              path_in_repo='${{ github.event.inputs.site }}.png',
              repo_id='Luishae0705/flowsearch-screenshots',
              repo_type='dataset',
          )
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
