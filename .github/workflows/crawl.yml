name: SG225 crawl
on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        job: [{lang: de, seeds: seeds-de-cc.txt}]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build
        working-directory: crawler
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o sgcrawl-bin ./sgcrawl
      - name: crawl
        working-directory: crawler
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          ulimit -n 60000 || true
          gunzip -kf seeds-de-cc.txt.gz
          URL=$(cat ../tunnel-url.txt)
          echo "$MYSEARCH_TOKEN" > token.txt
          ./sgcrawl-bin -lang ${{ matrix.job.lang }} -seeds ${{ matrix.job.seeds }} \
            -ingest "$URL/api/ingest" -token-file token.txt \
            -workers 1500 -delay 20ms -hours 5.5
