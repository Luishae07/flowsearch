name: Flowsearch webmaster-submitted crawl
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          echo "matrix=$(python3 -c "
          import json, os
          jobs = []
          for lang, dir in [('en', 'crawler/submitted'), ('de', 'crawler/submitted-de')]:
              if not os.path.isdir(dir):
                  continue
              for name in sorted(os.listdir(dir)):
                  if name.endswith('.txt'):
                      user = name[:-4]
                      jobs.append({'lang': lang, 'user': user, 'seeds': dir + '/' + name})
          print(json.dumps({'job': jobs}))
          ")" >> "$GITHUB_OUTPUT"

  crawl:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build
        working-directory: crawler
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o sgcrawl-bin ./sgcrawl
      - name: crawl ${{ matrix.job.user }}
        working-directory: crawler
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          URL=$(cat ../tunnel-url.txt)
          echo "$MYSEARCH_TOKEN" > token.txt
          ./sgcrawl-bin -lang ${{ matrix.job.lang }} -seeds ${{ matrix.job.seeds }} \
            -ingest "$URL/api/ingest" -token-file token.txt \
            -workers 50 -hours 1 -maxpages 5000
