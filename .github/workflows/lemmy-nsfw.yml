name: Lemmy NSFW communities
# Reads the public community list of every Lemmy server in lemmy/hosts.txt and keeps the communities that Lemmy itself marks NSFW.
# Communities only (no posts), so it finishes in minutes to an hour. Start it by hand (Actions, Run workflow).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: lemmy-nsfw
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read the community lists
        run: python3 scripts/lemmy_nsfw_communities.py lemmy/hosts.txt lemmy/result
      - name: Save the result in the repo
        run: |
          git config user.name "flowsearch-bot"
          git config user.email "flowsearch-bot@users.noreply.github.com"
          git add lemmy/result
          git commit -m "Lemmy NSFW communities (communities only)" || echo "nothing new"
          git push
