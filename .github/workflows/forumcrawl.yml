name: forumcrawl

# The crawl, in 4 jobs that run at the same time (the 4th, amazon, reads Amazon products in a real Chrome on the runner and sends them to the ingest):
#   lemmy      the Lemmy servers (crawler/forums-lemmy.txt)
#   discourse  the Discourse forums (crawler/forums-discourse.txt)
#   languages  the Python forums and the forums of other programming languages (crawler/forums-languages.txt)
# Each job fetches the public JSON of its forums with normal HTTP requests (no Browser Use); a forum that answers 403 is read with a real Firefox on the
# runner instead (geckodriver). The newest posts and their best comments go to the Flowsearch ingest, whose address is in tunnel-url.txt (the server keeps
# that file up to date). The ingest says which posts it already has, so only the new ones are opened.
# It runs every 6 hours; Actions > forumcrawl > Run workflow starts it by hand.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      ingest_url:
        description: "address of the ingest tunnel (empty: the one in tunnel-url.txt)"
        default: ""
      only:
        description: "run only one job: lemmy, discourse, languages or amazon (empty: all four)"
        default: ""
      amazon_n:
        description: "products to save from each Amazon site (empty: no limit, until the 130 minutes are up)"
        default: ""
      new_lemmy:
        description: "new Lemmy posts to read in all (0: no limit, until the time is up)"
        default: "0"
      per_discourse:
        description: "topics read from each Discourse forum (0: no limit, the forum is read until its topics run out)"
        default: "0"
      per_languages:
        description: "topics read from each Python / programming language forum (0: no limit)"
        default: "0"

permissions:
  contents: read

jobs:
  lemmy:
    if: ${{ inputs.only == '' || inputs.only == 'lemmy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: get the prebuilt forum crawler (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download flowcrawl-bin --repo "$GITHUB_REPOSITORY" --pattern lemmycrawl --dir bin --clobber
          chmod +x bin/lemmycrawl
      - name: Lemmy servers
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          URL="${{ inputs.ingest_url }}"
          if [ -z "$URL" ]; then URL=$(tr -d '[:space:]' < tunnel-url.txt); fi
          ./bin/lemmycrawl -plain -firefox -remote "$URL" -new \
            -n "${{ inputs.new_lemmy || '0' }}" -per 0 -minutes 330 -hostminutes 25 -browsers 12 -servers crawler/forums-lemmy.txt

  discourse:
    if: ${{ inputs.only == '' || inputs.only == 'discourse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: get the prebuilt forum crawler (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download flowcrawl-bin --repo "$GITHUB_REPOSITORY" --pattern lemmycrawl --dir bin --clobber
          chmod +x bin/lemmycrawl
      - name: Discourse forums
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          URL="${{ inputs.ingest_url }}"
          if [ -z "$URL" ]; then URL=$(tr -d '[:space:]' < tunnel-url.txt); fi
          ./bin/lemmycrawl -plain -firefox -remote "$URL" \
            -discourse crawler/forums-discourse.txt -per "${{ inputs.per_discourse || '0' }}" -minutes 330 -hostminutes 20 -browsers 12

  languages:
    if: ${{ inputs.only == '' || inputs.only == 'languages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: get the prebuilt forum crawler (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download flowcrawl-bin --repo "$GITHUB_REPOSITORY" --pattern lemmycrawl --dir bin --clobber
          chmod +x bin/lemmycrawl
      - name: Python and other programming language forums
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          URL="${{ inputs.ingest_url }}"
          if [ -z "$URL" ]; then URL=$(tr -d '[:space:]' < tunnel-url.txt); fi
          ./bin/lemmycrawl -plain -firefox -remote "$URL" \
            -discourse crawler/forums-languages.txt -per "${{ inputs.per_languages || '0' }}" -minutes 330 -hostminutes 25 -browsers 12

  amazon:
    if: ${{ inputs.only == '' || inputs.only == 'amazon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: get the prebuilt Amazon crawler (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download flowcrawl-bin --repo "$GITHUB_REPOSITORY" --pattern amzdata --dir bin --clobber
          chmod +x bin/amzdata
      - name: amazon.de (Firefox on this runner)
        timeout-minutes: 150
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          URL="${{ inputs.ingest_url }}"
          if [ -z "$URL" ]; then URL=$(tr -d '[:space:]' < tunnel-url.txt); fi
          # 1. collect product numbers from many listing pages (Bestsellers, New releases, Movers, Most wished for, with their categories); 2. visit the new ones
          ./bin/amzdata -firefox -site amazon.de -collect -shuffle -queue amz-de.txt
          ./bin/amzdata -firefox -remote "$URL" -site amazon.de -queue amz-de.txt -shuffle -n "${{ inputs.amazon_n || '1000000' }}" -minutes 130 -pause 1s -settle 1s
      - name: amazon.com (Firefox on this runner)
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          URL="${{ inputs.ingest_url }}"
          if [ -z "$URL" ]; then URL=$(tr -d '[:space:]' < tunnel-url.txt); fi
          ./bin/amzdata -firefox -site amazon.com -collect -shuffle -queue amz-com.txt
          ./bin/amzdata -firefox -remote "$URL" -site amazon.com -queue amz-com.txt -shuffle -n "${{ inputs.amazon_n || '1000000' }}" -minutes 130 -pause 1s -settle 1s
