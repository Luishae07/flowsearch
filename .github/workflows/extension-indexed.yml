name: Extension - is it indexed
on:
  workflow_dispatch:
  push:
    paths: ['extensions/indexed/**', '.github/workflows/extension-indexed.yml']
permissions:
  contents: write
concurrency:
  group: extension-indexed
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the manifest
        run: python3 -c "import json;m=json.load(open('extensions/indexed/manifest.json'));print(m['name'],m['version'],'manifest v'+str(m['manifest_version']))"
      - name: Zip it (manifest.json at the top of the zip)
        run: |
          cd extensions/indexed
          zip -r -X ../../Flowsearch-Indexed.zip . -x '.*'
          cd ../..
          unzip -l Flowsearch-Indexed.zip | tail -12
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: Flowsearch-Indexed.zip
      - name: Publish to the "extension-indexed" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view extension-indexed >/dev/null 2>&1 || gh release create extension-indexed \
            --title "Flowsearch: is it indexed? (browser extension)" \
            --notes "Firefox 127+ and Chrome. Unzip, then Firefox: about:debugging > This Firefox > Load Temporary Add-on > pick manifest.json. Chrome: chrome://extensions > Developer mode > Load unpacked."
          gh release upload extension-indexed Flowsearch-Indexed.zip --clobber
