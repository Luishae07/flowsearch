<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowsearch</title>
<meta name="description" content="Flowsearch: an open-source web search engine.">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='%23ffb347' stroke-width='3'/%3E%3Cpath d='M19 19l7 7' stroke='%23ffb347' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d12;--ink:#eaedf4;--dim:#8b95a8;--acc:#ffb347;color-scheme:dark light}
@media (prefers-color-scheme:light){:root{--bg:#f6f4ef;--ink:#1b1a17;--dim:#6b665c;--acc:#c96a00}}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px;text-align:center}
main{max-width:30em}
h1{font-size:34px;letter-spacing:-.02em;margin:0 0 8px}
p{color:var(--dim);margin:6px 0}
a{color:var(--acc)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-right:8px;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<main>
<h1>Flowsearch</h1>
<p id="msg"><span class="dot"></span>Opening Flowsearch …</p>
<p id="more" hidden>The search engine runs on a computer that is sometimes switched off or restarting. <a href="" onclick="location.reload();return false">Try again</a> in a minute.</p>
<p><a href="https://github.com/Luishae07/flowsearch-source">Source code</a></p>
<noscript><p>This page needs JavaScript to find the current address of Flowsearch. You can read it in
<a href="https://raw.githubusercontent.com/Luishae07/flowsearch/main/web-tunnel-url.txt">this file</a>.</p></noscript>
</main>
<script>
// A fixed address for Flowsearch, made of three steps:
//  1. The search engine runs behind a tunnel whose address changes when it restarts. The server writes the current address into web-tunnel-url.txt
//     in this repository, and this page reads it.
//  2. The page fetches the real page from that address (the site allows this one address to read its answers), puts a <base> tag in front so pictures,
//     styles and scripts load from the site, and shows it as THIS page: no frame, and the address bar stays on this address and follows every click.
//  3. Clicks on links of the site and searches (forms) are caught and done the same way. Links to other websites are followed normally.
// If fetching is not possible (the site does not allow it, or an old version is running), the page falls back to showing the site in a frame.
(function () {
  var SRC = 'https://raw.githubusercontent.com/Luishae07/flowsearch/main/web-tunnel-url.txt';
  var BASE = '/flowsearch'; // the folder of this page on github.io
  var T = '', THOST = '';   // the address of the site now, and its host name

  function pathNow() {
    var r = location.pathname;
    if (r.indexOf(BASE) === 0) r = r.slice(BASE.length);
    if (r === '' || r === '/index.html') r = '/';
    return r + location.search;
  }

  function offline() {
    document.getElementById('msg').textContent = 'Flowsearch is not reachable right now.';
    document.getElementById('more').hidden = false;
  }

  // the fallback: the real site in a frame
  function showFrame(path) {
    var f = document.createElement('iframe');
    f.title = 'Flowsearch';
    f.allow = 'clipboard-write; fullscreen';
    f.src = T + path + location.hash;
    document.body.textContent = '';
    document.body.appendChild(f);
    window.addEventListener('message', function (e) {
      if (e.origin !== T || e.source !== f.contentWindow || !e.data || e.data.flowsearch !== 1) return;
      var p = String(e.data.path || '/');
      if (p.charAt(0) !== '/' || p.charAt(1) === '/' || p.length > 2000) return;
      try { history.replaceState(null, '', BASE + p); } catch (x) {}
      if (e.data.title) document.title = String(e.data.title).slice(0, 200);
    });
  }

  // the page of the site, made ready to be shown here
  function rewrite(html) {
    html = html.replace(/<base\b[^>]*>/gi, '');
    // the site's scripts connect live pages (WebSockets) to "location.host"; here that must be the site, not this address
    html = html.replace(/location\.host(?![A-Za-z])/g, 'window.__fsHost');
    var inject = '<base href="' + T + '/"><script>window.__fsHost=' + JSON.stringify(THOST) + '<\/script>';
    if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function (m) { return m + inject; });
    return inject + html;
  }

  function render(html) {
    document.open();
    document.write(html);
    document.close();
    install();
  }

  // fetches a page of the site and shows it; mode says what happens to the address bar: push, replace or none
  function load(path, mode, opts) {
    opts = opts || {};
    opts.headers = { 'Accept': 'text/html' };
    return fetch(T + path, opts).then(function (res) {
      var u = new URL(res.url);
      if (u.origin !== T) throw new Error('left the site');
      var ct = res.headers.get('content-type') || '';
      if (ct.indexOf('text/html') < 0) { location.assign(res.url); return; } // not a page (a file, a picture ...): open it directly
      return res.text().then(function (html) {
        var p = u.pathname + u.search;
        try {
          if (mode === 'push') history.pushState(null, '', BASE + p);
          else if (mode === 'replace') history.replaceState(null, '', BASE + p);
        } catch (x) {}
        render(rewrite(html));
      });
    });
  }

  function go(path) {
    load(path, 'push').catch(function () { location.assign(T + path); }); // if it cannot be done here, the browser goes to the site itself
  }

  function onClick(e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
    var raw = a.getAttribute('href') || '';
    if (raw.charAt(0) === '#') { // a link inside the page
      var el = document.getElementById(decodeURIComponent(raw.slice(1)));
      e.preventDefault();
      if (el) el.scrollIntoView();
      try { history.replaceState(null, '', location.pathname + location.search + raw); } catch (x) {}
      return;
    }
    var u;
    try { u = new URL(a.href); } catch (x) { return; }
    if (u.origin !== T) return; // another website: the browser follows it normally
    e.preventDefault();
    go(u.pathname + u.search + u.hash);
  }

  function onSubmit(e) {
    var f = e.target;
    if (!f || f.tagName !== 'FORM' || e.defaultPrevented) return;
    var attr = f.getAttribute('action');
    var u;
    try { u = attr ? new URL(attr, T + '/') : new URL(T + pathNow()); } catch (x) { return; }
    if (u.origin !== T) return; // a form that sends to another website
    var data = new FormData(f);
    if (e.submitter && e.submitter.name) data.append(e.submitter.name, e.submitter.value);
    var pairs = [];
    data.forEach(function (v, k) { if (typeof v === 'string') pairs.push([k, v]); });
    e.preventDefault();
    if ((f.method || 'get').toLowerCase() === 'post') {
      var body = f.enctype === 'multipart/form-data' ? data : new URLSearchParams(pairs);
      load(u.pathname + u.search, 'push', { method: 'POST', body: body }).catch(function () { location.assign(T + u.pathname + u.search); });
    } else {
      u.search = new URLSearchParams(pairs).toString();
      go(u.pathname + u.search);
    }
  }

  function onPop() {
    load(pathNow(), 'none').catch(function () { location.reload(); });
  }

  // document.open() removes all listeners, so they are set again after every page
  function install() {
    document.addEventListener('click', onClick, true);
    document.addEventListener('submit', onSubmit, true);
    window.addEventListener('popstate', onPop);
    if (location.hash) {
      var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) el.scrollIntoView();
    }
  }

  fetch(SRC + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (t) {
      var u = t.trim().replace(/\/+$/, '');
      if (!/^https:\/\/[a-z0-9.-]+$/i.test(u)) throw new Error('bad address');
      T = u;
      THOST = new URL(u).host;
      return load(pathNow(), 'replace').catch(function () { showFrame(pathNow()); });
    })
    .catch(offline);
})();
</script>
</body>
</html>
