name: Flowsearch crawl (submitted by the webmaster tools)
run-name: crawl ${{ inputs.url || inputs.site }}
on:
  workflow_dispatch:
    inputs:
      site:
        description: Website to crawl (its seed file is crawler/sites/<site>.txt)
        required: false
      lang:
        description: Language filter (any, en or de)
        required: false
        default: any
      url:
        description: One page to crawl instead of a whole site
        required: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build
        working-directory: crawler
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o sgcrawl-bin ./sgcrawl
      - name: crawl
        working-directory: crawler
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
          SITE: ${{ inputs.site }}
          LANG_FILTER: ${{ inputs.lang }}
          PAGE_URL: ${{ inputs.url }}
        run: |
          URL=$(cat ../tunnel-url.txt)
          echo "$MYSEARCH_TOKEN" > token.txt
          if [ -n "$PAGE_URL" ]; then
            ./sgcrawl-bin -lang any -url "$PAGE_URL" -ingest "$URL/api/ingest" -token-file token.txt
          else
            ./sgcrawl-bin -lang "${LANG_FILTER:-any}" -seeds "sites/$SITE.txt" \
              -ingest "$URL/api/ingest" -token-file token.txt \
              -workers 500 -hours 1 -maxpages 5000
          fi
