name: Flowsearch browser (a Chrome for the Flowsearch server)
run-name: browser ${{ inputs.id }}
# The Flowsearch server starts this job when a feature needs a real Chrome (screenshots of results, privacy grades, price updates, icons,
# llms.txt, archive screenshots, page text). The job starts Chrome on the GitHub runner and connects BACK to the server with the shared
# token; the server then drives that Chrome through the connection (Chrome DevTools). Nothing is stored here. The job ends when the server
# closes the connection, and after 13 minutes at the latest.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Browser id (made by the Flowsearch server)"
        required: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: start Chrome and connect to the server
        env:
          BROWSER_ID: ${{ github.event.inputs.id }}
          TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          pip install --quiet "websockets>=14"
          python3 - <<'EOF'
          import asyncio, json, os, subprocess, time, urllib.request
          from websockets.asyncio.client import connect

          ID, TOKEN = os.environ["BROWSER_ID"], os.environ["TOKEN"]
          chrome = subprocess.Popen(
              ["google-chrome", "--headless=new", "--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage", "--hide-scrollbars", "--mute-audio",
               "--remote-debugging-port=9222", "--remote-allow-origins=*", "--window-size=1280,720", "about:blank"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def page_ws():
              for _ in range(120):
                  try:
                      for t in json.load(urllib.request.urlopen("http://127.0.0.1:9222/json/list", timeout=2)):
                          if t.get("type") == "page":
                              return t["webSocketDebuggerUrl"]
                  except Exception:
                      pass
                  time.sleep(0.25)
              raise SystemExit("Chrome did not start")

          async def dial():
              # the server may be restarting or a connection may fail: try again every 2 seconds for up to 40 seconds
              last = None
              for _ in range(20):
                  try:
                      return await connect("wss://flowsearch.org/api/browserjob/runner?id=" + ID,
                                           additional_headers={"Authorization": "Bearer " + TOKEN},
                                           max_size=None, ping_interval=None, open_timeout=15)
                  except Exception as e:
                      last = e
                      await asyncio.sleep(2)
              raise last

          async def main():
              page = page_ws()
              srv_conn = await dial()
              async with srv_conn as srv, connect(page, max_size=None, ping_interval=None, origin=None) as chrome_ws:
                  async def up():      # from the server to Chrome
                      async for m in srv:
                          await chrome_ws.send(m)
                  async def down():    # from Chrome to the server
                      async for m in chrome_ws:
                          await srv.send(m)
                  tasks = [asyncio.create_task(up()), asyncio.create_task(down())]
                  await asyncio.wait(tasks, return_when=asyncio.FIRST_COMPLETED)
                  for t in tasks:
                      t.cancel()

          try:
              asyncio.run(main())
          finally:
              chrome.kill()
          EOF
