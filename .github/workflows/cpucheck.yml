name: CPU check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: gpu info
        run: |
          echo "--- lspci (looking for VGA/3D) ---"
          lspci | grep -i "vga\|3d\|display" || echo "no GPU-like PCI device found"
          echo "--- nvidia-smi ---"
          nvidia-smi || echo "no nvidia-smi"
          echo "--- lshw ---"
          lshw -C display 2>/dev/null || echo "no lshw display info"
