name: forumcrawl

# The forum crawl. A real Chrome on this runner (started by the crawler, driven over the DevTools protocol, no Browser Use) opens the public JSON of
# Lemmy servers and Discourse forums, reads the newest posts and their best comments, and sends them to the Flowsearch ingest, whose address is in
# tunnel-url.txt (the server keeps that file up to date). The ingest says which posts it already has, so only the new ones are opened.
# It runs every 6 hours; Actions > forumcrawl > Run workflow starts it by hand.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      ingest_url:
        description: "address of the ingest tunnel (empty: the one in tunnel-url.txt)"
        default: ""
      per_discourse:
        description: "topics read from each Discourse forum"
        default: "60"
      new_lemmy:
        description: "new Lemmy posts to read in all"
        default: "3000"

permissions:
  contents: read

jobs:
  forums:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: get the prebuilt forum crawler (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download flowcrawl-bin --repo "$GITHUB_REPOSITORY" --pattern lemmycrawl --dir bin --clobber
          chmod +x bin/lemmycrawl
      - name: address of the ingest
        id: addr
        run: |
          URL="${{ inputs.ingest_url }}"
          if [ -z "$URL" ]; then URL=$(tr -d '[:space:]' < tunnel-url.txt); fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Discourse forums
        timeout-minutes: 150
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          ./bin/lemmycrawl -chrome -remote "${{ steps.addr.outputs.url }}" \
            -discourse crawler/forums-discourse.txt -per "${{ inputs.per_discourse || '60' }}" -browsers 4
      - name: Lemmy servers
        if: ${{ !cancelled() }}
        timeout-minutes: 170
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
        run: |
          ./bin/lemmycrawl -chrome -remote "${{ steps.addr.outputs.url }}" -new \
            -n "${{ inputs.new_lemmy || '3000' }}" -per 40 -browsers 4 -servers crawler/forums-lemmy.txt
