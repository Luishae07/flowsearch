name: Crawl one URL
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page address
        required: true
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build
        working-directory: crawler
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o sgcrawl-bin ./sgcrawl
      - name: crawl
        working-directory: crawler
        env:
          MYSEARCH_TOKEN: ${{ secrets.MYSEARCH_TOKEN }}
          PAGE_URL: ${{ inputs.url }}
        run: |
          URL=$(cat ../tunnel-url.txt)
          echo "$MYSEARCH_TOKEN" > token.txt
          ./sgcrawl-bin -lang any -url "$PAGE_URL" -ingest "$URL/api/ingest" -token-file token.txt
